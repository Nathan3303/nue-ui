        <link href="/fonts/pf/font.css" rel="stylesheet" />
        <link href="/fonts/plex/font.css" rel="stylesheet" />

    <style>
        :root {
            /* Frostline 演示字体：IBM Plex Sans（工程感中性字）× Plex Mono（读数）。
               中文仍走 pf 切片；pf 只有 400，禁用合成粗体以免 500 被“涂糊”。 */
            --nue-primary-font-family: 'IBM Plex Sans', 'pf';
            --nue-font-mono:
                'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-synthesis-weight: none;
        }
    </style>
